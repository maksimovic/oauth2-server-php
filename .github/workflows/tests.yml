name: Test Suite
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
      mongodb:
        image: mongo
        ports:
          - 27017:27017
        options: --health-cmd="mongosh --eval 'db.runCommand(\"ping\").ok'" --health-interval=10s --health-timeout=5s --health-retries=5
      mariadb:
        image: mariadb
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres
        env:
          POSTGRES_DB: oauth2_server_php
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -h localhost" --health-interval=10s --health-timeout=5s --health-retries=5
      cassandra:
        image: cassandra:4
        ports:
          - 9042:9042
        options: --health-cmd="cqlsh -e 'describe cluster'" --health-interval=15s --health-timeout=10s --health-retries=10
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
        options: --health-cmd="wget -q -O /dev/null http://localhost:8000 || exit 1" --health-interval=10s --health-timeout=5s --health-retries=5
    strategy:
      matrix:
        php: [ 8.1, 8.2, 8.3, 8.4, 8.5 ]
    name: "PHP ${{ matrix.php }} Unit Test"
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mongodb, mbstring, intl, redis, pdo_mysql, pdo_pgsql
      - name: Install composer dependencies
        run: composer install
      - name: Run PHPUnit
        run: vendor/bin/phpunit
  phpstan:
    name: "PHPStan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
      - name: Install composer dependencies
        run: composer install
      - name: Run PHPStan
        run: |
          composer require phpstan/phpstan
          vendor/bin/phpstan analyse
