name: Test Suite
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
      mongodb:
        image: mongo
        ports:
          - 27017:27017
        options: --health-cmd="mongosh --eval 'db.runCommand(\"ping\").ok'" --health-interval=10s --health-timeout=5s --health-retries=5
      mariadb:
        image: mariadb
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres
        env:
          POSTGRES_DB: oauth2_server_php
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -h localhost" --health-interval=10s --health-timeout=5s --health-retries=5
    strategy:
      matrix:
        php: [ 8.1, 8.2, 8.3, 8.4, 8.5 ]
    name: "PHP ${{ matrix.php }} Unit Test"
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - name: Start slow containers in background
        run: |
          docker run -d --name cassandra -p 9042:9042 cassandra:4
          docker run -d --name dynamodb -p 8000:8000 amazon/dynamodb-local
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mongodb, mbstring, intl, redis, pdo_mysql, pdo_pgsql
      - name: Install composer dependencies
        run: composer install
      - name: Wait for slow containers
        run: |
          echo "Waiting for DynamoDB..."
          timeout 30 bash -c 'until docker exec dynamodb bash -c "echo > /dev/tcp/localhost/8000" 2>/dev/null; do sleep 1; done'
          echo "DynamoDB ready"

          echo "Waiting for Cassandra..."
          timeout 120 bash -c 'until docker exec cassandra cqlsh -e "describe cluster" 2>/dev/null; do sleep 5; done'
          echo "Cassandra ready"
      - name: Run PHPUnit
        run: composer test
  phpstan:
    name: "PHPStan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
      - name: Install composer dependencies
        run: composer install
      - name: Run PHPStan
        run: composer analyze
