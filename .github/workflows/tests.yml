name: Test Suite
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
      mongodb:
        image: mongo
        ports:
          - 27017:27017
        options: --health-cmd="mongosh --eval 'db.runCommand(\"ping\").ok'" --health-interval=10s --health-timeout=5s --health-retries=5
      mariadb:
        image: mariadb
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres
        env:
          POSTGRES_DB: oauth2_server_php
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -h localhost" --health-interval=10s --health-timeout=5s --health-retries=5
    strategy:
      matrix:
        php: [ 8.1, 8.2, 8.3, 8.4, 8.5 ]
    name: "PHP ${{ matrix.php }} Unit Test"
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
      CB_CONNECTION_STRING: couchbase://127.0.0.1
      CB_USERNAME: Administrator
      CB_PASSWORD: password
      CB_BUCKET: oauth2test
    steps:
      - uses: actions/checkout@v5
      - name: Start slow containers in background
        run: |
          docker run -d --name cassandra -p 9042:9042 cassandra:4
          docker run -d --name dynamodb -p 8000:8000 amazon/dynamodb-local
          docker run -d --name couchbase -p 8091-8096:8091-8096 -p 11210:11210 couchbase:community-7.6.5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mongodb, mbstring, intl, redis, pdo_mysql, pdo_pgsql, couchbase
      - name: Install composer dependencies
        run: composer install
      - name: Wait for slow containers
        run: |
          echo "Waiting for DynamoDB..."
          timeout 30 bash -c 'until docker exec dynamodb bash -c "echo > /dev/tcp/localhost/8000" 2>/dev/null; do sleep 1; done'
          echo "DynamoDB ready"

          echo "Waiting for Couchbase..."
          timeout 90 bash -c 'until curl -sf http://127.0.0.1:8091/ui/index.html > /dev/null 2>&1; do sleep 2; done'
          echo "Couchbase responding"

          # Initialize cluster
          curl -sf -X POST http://127.0.0.1:8091/clusterInit \
            -d clusterName=ci \
            -d services=kv \
            -d memoryQuota=256 \
            -d afamily=ipv4 \
            -d afamilyOnly=false \
            -d nodeEncryption=off \
            -d username=Administrator \
            -d password=password \
            -d port=SAME \
            -d sendStats=false
          echo "Couchbase cluster initialized"

          # Create bucket
          curl -sf -X POST http://127.0.0.1:8091/pools/default/buckets \
            -u Administrator:password \
            -d name=oauth2test \
            -d ramQuota=128 \
            -d bucketType=couchbase
          echo "Couchbase bucket created"

          # Wait for bucket to be ready
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:8091/pools/default/buckets/oauth2test -u Administrator:password | grep -q '"'"'"status":"healthy"'"'"'; do sleep 2; done'
          echo "Couchbase ready"

          echo "Waiting for Cassandra..."
          timeout 120 bash -c 'until docker exec cassandra cqlsh -e "describe cluster" 2>/dev/null; do sleep 5; done'
          echo "Cassandra ready"
      - name: Run PHPUnit
        run: composer test
  phpstan:
    name: "PHPStan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
      - name: Install composer dependencies
        run: composer install
      - name: Run PHPStan
        run: composer analyze
